apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def aarFile = file('src/main/libs/rnturboimagepicker-release.aar')
def extractDir = file("$projectDir/extracted-aar")

// Extract AAR at configuration time so sourceSets can see the manifest and resources immediately
if (aarFile.exists()) {
    copy {
        from zipTree(aarFile)
        into extractDir
    }
    
    // Strip package attribute from AndroidManifest.xml
    def manifestFile = file("$extractDir/AndroidManifest.xml")
    if (manifestFile.exists()) {
        def content = manifestFile.getText('UTF-8')
        content = content.replaceAll(/package="[^"]+"/, "")
        manifestFile.write(content, 'UTF-8')
    }
    
    // Remove BuildConfig.class from classes.jar to prevent R8 Duplicate Class errors
    def classesJar = file("$extractDir/classes.jar")
    if (classesJar.exists()) {
        def tempDir = file("$extractDir/temp_classes")
        tempDir.mkdirs()
        
        ant.unzip(src: classesJar, dest: tempDir)
        
        def buildConfigClass = file("$tempDir/com/rnturboimagepicker/BuildConfig.class")
        if (buildConfigClass.exists()) {
            buildConfigClass.delete()
        }
        
        classesJar.delete()
        ant.zip(destfile: classesJar, basedir: tempDir)
        
        tempDir.deleteDir()
    }
}

android {
    namespace "com.rnturboimagepicker"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }
    
    buildFeatures {
        buildConfig false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }


    sourceSets {
        main {
            java {
                srcDirs = ["src/main/java"]
            }
            jniLibs.srcDirs = ["$extractDir/jni"]
            res.srcDirs = ["$extractDir/res"]
            assets.srcDirs = ["$extractDir/assets"]
            manifest.srcFile "$extractDir/AndroidManifest.xml"
        }
    }
}

dependencies {
    // Add the classes.jar from the extracted AAR
    implementation fileTree(dir: "$extractDir", include: ['*.jar'])
    compileOnly "com.facebook.react:react-android:+"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    
    // CameraX for live preview
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
