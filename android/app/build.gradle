plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.rnturboimagepicker.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.rnturboimagepicker.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // Allow installRelease task to run
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':rnturboimagepicker')
    
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // For image display
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Glide (for result image display in test app)
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Coroutines (for async image processing)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

